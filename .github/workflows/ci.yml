name: CI

on:
  push:
  pull_request:

jobs:
  swift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Build kit and tests
        run: swift test
        working-directory: swift-userscript
      - name: Build example userscript
        run: swift build
        working-directory: examples/hello
      - name: Test copilot example
        run: swift test
        working-directory: examples/copilot

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Typecheck extension
        run: npm install && npm run compile
        working-directory: extension
      - name: Command registry tests
        run: node test/commands.test.mjs
      - name: Package VSIX
        run: npm run package
        working-directory: extension
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension/*.vsix
          retention-days: 30

  smoke:
    runs-on: ubuntu-latest
    needs: [swift, extension]
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build userscripts
        run: |
          swift build --package-path examples/hello
          swift build --package-path examples/copilot
      - name: Protocol smoke test
        run: node test/smoke.mjs examples/hello/.build/debug/HelloUserscript examples/copilot/.build/debug/CopilotUserscript

  vswift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build vswift tool and hello example
        run: |
          swift build --package-path swift-userscript
          swift build --package-path examples/hello
      - name: Compile extension
        run: npm install && npm run compile
        working-directory: extension
      - name: .vswift bundle tests
        run: node test/vswift.test.mjs
